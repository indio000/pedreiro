<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - Guimara</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col">

    <div id="telaLogin" class="fixed inset-0 bg-slate-900 bg-opacity-95 z-50 flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-2xl shadow-2xl max-w-sm w-full border border-slate-200 text-center">
            <div class="w-16 h-16 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center text-2xl mx-auto mb-4">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h2 class="text-2xl font-bold text-slate-900 mb-1">Acesso Restrito</h2>
            <p class="text-xs text-slate-500 mb-6">Digite a senha do administrador para visualizar os orçamentos das obras.</p>
            
            <form onsubmit="fazerLogin(event)" class="space-y-4">
                <div>
                    <input type="password" id="inputSenha" placeholder="Senha de Acesso" required
                        class="w-full px-4 py-3 border border-slate-300 rounded-lg text-center font-bold text-lg tracking-widest focus:outline-none focus:ring-2 focus:ring-amber-500 transition">
                </div>
                <div id="msgErroLogin" class="text-xs text-red-600 font-semibold hidden"></div>
                <button type="submit" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-3 rounded-lg shadow-md transition">
                    Entrar no Painel
                </button>
            </form>
            <a href="/" class="inline-block mt-4 text-xs text-slate-400 hover:text-slate-600">Voltar para o site principal</a>
        </div>
    </div>

    <div id="conteudoPainel" class="hidden flex-col min-h-screen">
        <header class="bg-slate-800 text-white py-4 px-6 shadow-md flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-screwdriver-wrench text-amber-500"></i> Painel de Controle - Obras
            </h1>
            <div class="flex items-center gap-3">
                <a href="/" class="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded text-slate-300">Ir ao Site</a>
                <button onclick="fazerLogout()" class="text-xs bg-red-600 hover:bg-red-700 px-3 py-1.5 rounded text-white font-bold flex items-center gap-1">
                    <i class="fa-solid fa-right-from-bracket"></i> Sair
                </button>
            </div>
        </header>

        <main class="max-w-6xl mx-auto px-4 py-8 flex-grow w-full">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
                    <div>
                        <p class="text-xs font-bold text-slate-500 uppercase tracking-wider">Serviços Pendentes</p>
                        <h3 id="qtdPendentes" class="text-3xl font-extrabold text-yellow-600">0</h3>
                    </div>
                    <div class="w-12 h-12 bg-yellow-100 text-yellow-600 rounded-full flex items-center justify-center text-xl">
                        <i class="fa-solid fa-clock"></i>
                    </div>
                </div>
                <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
                    <div>
                        <p class="text-xs font-bold text-slate-500 uppercase tracking-wider">Total de Solicitações</p>
                        <h3 id="qtdTotal" class="text-3xl font-extrabold text-slate-800">0</h3>
                    </div>
                    <div class="w-12 h-12 bg-slate-100 text-slate-600 rounded-full flex items-center justify-center text-xl">
                        <i class="fa-solid fa-list-check"></i>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="p-5 border-b bg-slate-50 flex flex-col sm:flex-row justify-between items-center gap-4">
                    <div class="flex items-center gap-2">
                        <button onclick="definirFiltro('todos')" id="btnFiltroTodos" class="px-3 py-1.5 text-xs font-bold rounded-lg bg-amber-600 text-white">Todos</button>
                        <button onclick="definirFiltro('pendentes')" id="btnFiltroPendentes" class="px-3 py-1.5 text-xs font-bold rounded-lg bg-slate-200 text-slate-700 hover:bg-slate-300">Apenas Pendentes</button>
                    </div>
                    <button onclick="carregarAgendamentos()" class="bg-amber-600 hover:bg-amber-700 text-white text-xs px-3 py-1.5 rounded font-medium flex items-center gap-1">
                        <i class="fa-solid fa-rotate"></i> Atualizar
                    </button>
                </div>
                
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse text-sm">
                        <thead>
                            <tr class="bg-slate-100 text-slate-600 uppercase font-semibold text-xs tracking-wider border-b">
                                <th class="p-4">Cliente / Contato</th>
                                <th class="p-4">Serviço / Detalhes</th>
                                <th class="p-4">Data / Local</th>
                                <th class="p-4">Status</th>
                                <th class="p-4 text-center">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tabelaCorpo" class="divide-y divide-slate-100">
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        let filtroAtual = 'todos';

        async function verificarSessao() {
            try {
                const res = await fetch('/api/admin/check-session');
                const data = await res.json();
                if (data.autenticado) exibirPainel();
                else exibirLogin();
            } catch (e) {
                exibirLogin();
            }
        }

        function exibirPainel() {
            document.getElementById('telaLogin').classList.add('hidden');
            document.getElementById('conteudoPainel').classList.remove('hidden');
            document.getElementById('conteudoPainel').classList.add('flex');
            carregarAgendamentos();
        }

        function exibirLogin() {
            document.getElementById('telaLogin').classList.remove('hidden');
            document.getElementById('conteudoPainel').classList.add('hidden');
            document.getElementById('conteudoPainel').classList.remove('flex');
        }

        async function fazerLogin(e) {
            e.preventDefault();
            const senha = document.getElementById('inputSenha').value;
            const msgErro = document.getElementById('msgErroLogin');
            msgErro.classList.add('hidden');

            try {
                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ senha })
                });

                const data = await res.json();
                if (res.ok) {
                    document.getElementById('inputSenha').value = '';
                    exibirPainel();
                } else {
                    msgErro.innerText = data.error || "Senha incorreta!";
                    msgErro.classList.remove('hidden');
                }
            } catch (err) {
                msgErro.innerText = "Erro ao tentar realizar login.";
                msgErro.classList.remove('hidden');
            }
        }

        async function fazerLogout() {
            await fetch('/api/admin/logout', { method: 'POST' });
            exibirLogin();
        }

        function definirFiltro(tipo) {
            filtroAtual = tipo;
            const btnTodos = document.getElementById('btnFiltroTodos');
            const btnPendentes = document.getElementById('btnFiltroPendentes');

            if (tipo === 'todos') {
                btnTodos.className = "px-3 py-1.5 text-xs font-bold rounded-lg bg-amber-600 text-white";
                btnPendentes.className = "px-3 py-1.5 text-xs font-bold rounded-lg bg-slate-200 text-slate-700 hover:bg-slate-300";
            } else {
                btnPendentes.className = "px-3 py-1.5 text-xs font-bold rounded-lg bg-yellow-500 text-white";
                btnTodos.className = "px-3 py-1.5 text-xs font-bold rounded-lg bg-slate-200 text-slate-700 hover:bg-slate-300";
            }
            carregarAgendamentos();
        }

        async function carregarAgendamentos() {
            try {
                const res = await fetch('/api/agendamentos');
                if (res.status === 401) {
                    exibirLogin();
                    return;
                }

                const agendamentos = await res.json();
                const pendentes = agendamentos.filter(a => a.status === 'Pendente');
                document.getElementById('qtdPendentes').innerText = pendentes.length;
                document.getElementById('qtdTotal').innerText = agendamentos.length;

                const listaExibicao = filtroAtual === 'pendentes' ? pendentes : agendamentos;
                const tbody = document.getElementById('tabelaCorpo');

                if (listaExibicao.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-gray-500">Nenhum agendamento encontrado.</td></tr>`;
                    return;
                }

                tbody.innerHTML = listaExibicao.map(item => {
                    const ePendente = item.status === 'Pendente';
                    return `
                        <tr class="${ePendente ? 'bg-yellow-50/50 hover:bg-yellow-100/50' : 'hover:bg-slate-50'} transition">
                            <td class="p-4">
                                <div class="font-bold text-slate-900">${item.nome}</div>
                                <div class="text-xs text-gray-500">${item.telefone}</div>
                            </td>
                            <td class="p-4">
                                <div class="font-medium text-amber-700">${item.servico}</div>
                                <div class="text-xs text-gray-500 max-w-xs truncate">${item.descricao || 'Sem descrição.'}</div>
                            </td>
                            <td class="p-4">
                                <div class="font-medium">${item.data}</div>
                                <div class="text-xs text-gray-500 max-w-xs truncate">${item.endereco}</div>
                            </td>
                            <td class="p-4">
                                <select onchange="atualizarStatus('${item.id}', this.value)" class="text-xs px-2 py-1 rounded font-bold uppercase ${
                                    item.status === 'Confirmado' ? 'bg-green-100 text-green-800' :
                                    item.status === 'Concluído' ? 'bg-blue-100 text-blue-800' : 'bg-yellow-100 text-yellow-800'
                                }">
                                    <option value="Pendente" ${item.status === 'Pendente' ? 'selected' : ''}>Pendente</option>
                                    <option value="Confirmado" ${item.status === 'Confirmado' ? 'selected' : ''}>Confirmado</option>
                                    <option value="Concluído" ${item.status === 'Concluído' ? 'selected' : ''}>Concluído</option>
                                </select>
                            </td>
                            <td class="p-4 text-center">
                                <button onclick="deletarAgendamento('${item.id}')" class="text-red-500 hover:text-red-700 text-sm p-1">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                }).join('');
            } catch(e) { console.error(e); }
        }

        async function atualizarStatus(id, novoStatus) {
            await fetch('/api/agendamentos/status', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id, status: novoStatus })
            });
            carregarAgendamentos();
        }

        async function deletarAgendamento(id) {
            if(!confirm("Deseja realmente remover esta solicitação?")) return;
            await fetch(`/api/agendamentos/${id}`, { method: 'DELETE' });
            carregarAgendamentos();
        }

        verificarSessao();
    </script>
</body>
</html>
