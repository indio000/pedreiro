<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - Guimara</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col">

    <header class="bg-slate-800 text-white py-4 px-6 shadow-md flex justify-between items-center">
        <h1 class="text-xl font-bold flex items-center gap-2">
            <i class="fa-solid fa-screwdriver-wrench text-amber-500"></i> Painel de Controle - Obras
        </h1>
        <a href="/" class="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded text-slate-300">Sair do Painel</a>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8 flex-grow w-full">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
                <div>
                    <p class="text-xs font-bold text-slate-500 uppercase tracking-wider">Serviços Pendentes</p>
                    <h3 id="qtdPendentes" class="text-3xl font-extrabold text-yellow-600">0</h3>
                </div>
                <div class="w-12 h-12 bg-yellow-100 text-yellow-600 rounded-full flex items-center justify-center text-xl">
                    <i class="fa-solid fa-clock"></i>
                </div>
            </div>
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
                <div>
                    <p class="text-xs font-bold text-slate-500 uppercase tracking-wider">Total de Solictações</p>
                    <h3 id="qtdTotal" class="text-3xl font-extrabold text-slate-800">0</h3>
                </div>
                <div class="w-12 h-12 bg-slate-100 text-slate-600 rounded-full flex items-center justify-center text-xl">
                    <i class="fa-solid fa-list-check"></i>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="p-5 border-b bg-slate-50 flex flex-col sm:flex-row justify-between items-center gap-4">
                <div class="flex items-center gap-2">
                    <button onclick="definirFiltro('todos')" id="btnFiltroTodos" class="px-3 py-1.5 text-xs font-bold rounded-lg bg-amber-600 text-white">Todos</button>
                    <button onclick="definirFiltro('pendentes')" id="btnFiltroPendentes" class="px-3 py-1.5 text-xs font-bold rounded-lg bg-slate-200 text-slate-700 hover:bg-slate-300">Apenas Pendentes</button>
                </div>
                <button onclick="carregarAgendamentos()" class="bg-amber-600 hover:bg-amber-700 text-white text-xs px-3 py-1.5 rounded font-medium flex items-center gap-1">
                    <i class="fa-solid fa-rotate"></i> Atualizar
                </button>
            </div>
            
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="bg-slate-100 text-slate-600 uppercase font-semibold text-xs tracking-wider border-b">
                            <th class="p-4">Cliente / Contato</th>
                            <th class="p-4">Serviço / Detalhes</th>
                            <th class="p-4">Data / Local</th>
                            <th class="p-4">Status</th>
                            <th class="p-4 text-center">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaCorpo" class="divide-y divide-slate-100">
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        let filtroAtual = 'todos';

        function definirFiltro(tipo) {
            filtroAtual = tipo;
            const btnTodos = document.getElementById('btnFiltroTodos');
            const btnPendentes = document.getElementById('btnFiltroPendentes');

            if (tipo === 'todos') {
                btnTodos.className = "px-3 py-1.5 text-xs font-bold rounded-lg bg-amber-600 text-white";
                btnPendentes.className = "px-3 py-1.5 text-xs font-bold rounded-lg bg-slate-200 text-slate-700 hover:bg-slate-300";
            } else {
                btnPendentes.className = "px-3 py-1.5 text-xs font-bold rounded-lg bg-yellow-500 text-white";
                btnTodos.className = "px-3 py-1.5 text-xs font-bold rounded-lg bg-slate-200 text-slate-700 hover:bg-slate-300";
            }
            carregarAgendamentos();
        }

        async function carregarAgendamentos() {
            try {
                const res = await fetch('/api/agendamentos');
                const agendamentos = await res.json();
                
                // Atualizar Contadores
                const pendentes = agendamentos.filter(a => a.status === 'Pendente');
                document.getElementById('qtdPendentes').innerText = pendentes.length;
                document.getElementById('qtdTotal').innerText = agendamentos.length;

                // Filtrar lista conforme seleção
                const listaExibicao = filtroAtual === 'pendentes' ? pendentes : agendamentos;

                const tbody = document.getElementById('tabelaCorpo');
                tbody.innerHTML = '';

                if (listaExibicao.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-gray-500">Nenhum agendamento encontrado.</td></tr>`;
                    return;
                }

                listaExibicao.forEach(item => {
                    const ePendente = item.status === 'Pendente';
                    tbody.innerHTML += `
                        <tr class="${ePendente ? 'bg-yellow-50/50 hover:bg-yellow-100/50' : 'hover:bg-slate-50'} transition">
                            <td class="p-4">
                                <div class="font-bold text-slate-900">${item.nome}</div>
                                <div class="text-xs text-gray-500">${item.telefone}</div>
                            </td>
                            <td class="p-4">
                                <div class="font-medium text-amber-700">${item.servico}</div>
                                <div class="text-xs text-gray-500 max-w-xs truncate">${item.descricao || 'Sem descrição.'}</div>
                            </td>
                            <td class="p-4">
                                <div class="font-medium">${item.data}</div>
                                <div class="text-xs text-gray-500 max-w-xs truncate">${item.endereco}</div>
                            </td>
                            <td class="p-4">
                                <select onchange="atualizarStatus('${item.id}', this.value)" class="text-xs px-2 py-1 rounded font-bold uppercase ${
                                    item.status === 'Confirmado' ? 'bg-green-100 text-green-800' :
                                    item.status === 'Concluído' ? 'bg-blue-100 text-blue-800' : 'bg-yellow-100 text-yellow-800'
                                }">
                                    <option value="Pendente" ${item.status === 'Pendente' ? 'selected' : ''}>Pendente</option>
                                    <option value="Confirmado" ${item.status === 'Confirmado' ? 'selected' : ''}>Confirmado</option>
                                    <option value="Concluído" ${item.status === 'Concluído' ? 'selected' : ''}>Concluído</option>
                                </select>
                            </td>
                            <td class="p-4 text-center">
                                <button onclick="deletarAgendamento('${item.id}')" class="text-red-500 hover:text-red-700 text-sm p-1"><i class="fa-solid fa-trash"></i></button>
                            </td>
                        </tr>
                    `;
                });
            } catch(e) { console.error(e); }
        }

        async function atualizarStatus(id, novoStatus) {
            await fetch('/api/agendamentos/status', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id, status: novoStatus })
            });
            carregarAgendamentos();
        }

        async function deletarAgendamento(id) {
            if(!confirm("Deseja realmente remover esta solicitação?")) return;
            await fetch(`/api/agendamentos/${id}`, { method: 'DELETE' });
            carregarAgendamentos();
        }

        carregarAgendamentos();
    </script>
</body>
</html>
