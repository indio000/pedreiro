<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitar Agendamento</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen">

    <nav class="bg-amber-600 text-white shadow-md">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <a href="/" class="text-2xl font-bold flex items-center gap-2"><i class="fa-solid fa-helmet-safety"></i> Guimara</a>
            <div class="hidden md:flex gap-6 font-medium">
                <a href="/" class="hover:text-amber-200 transition">Início</a>
                <a href="/servicos.html" class="hover:text-amber-200 transition">Serviços</a>
                <a href="/agendamentos.html" class="text-amber-200 font-bold">Agendar</a>
                <a href="/status.html" class="hover:text-amber-200 transition">Status</a>
                <a href="/clientes.html" class="hover:text-amber-200 transition">Depoimentos</a>
                <a href="/contato.html" class="hover:text-amber-200 transition">Contato</a>
            </div>
        </div>
    </nav>

    <main class="max-w-xl mx-auto px-4 py-12 flex-grow w-full">
        <div class="bg-white p-8 rounded-2xl shadow-md border border-gray-100">
            <h2 class="text-2xl font-bold text-slate-900 mb-6 text-center">Solicitar Orçamento / Obra</h2>
            
            <form id="formAgendamento" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Seu Nome Completo *</label>
                    <input type="text" id="nome" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Telefone/WhatsApp *</label>
                        <input type="text" id="telefone" placeholder="(46) 99999-9999" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Data Pretendida *</label>
                        <input type="date" id="data" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Endereço da Obra *</label>
                    <input type="text" id="endereco" placeholder="Rua, Número, Bairro - Cidade" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Tipo de Serviço *</label>
                    <select id="servico" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none">
                        <option value="">Selecione...</option>
                        <option value="Reformas Residenciais">Reformas Residenciais</option>
                        <option value="Pisos e Revestimentos">Pisos e Revestimentos</option>
                        <option value="Pintura e Acabamento">Pintura e Acabamento</option>
                        <option value="Alvenaria">Alvenaria / Outros</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Descrição dos Detalhes</label>
                    <textarea id="descricao" rows="3" placeholder="Explique brevemente o que precisa ser feito..." class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none"></textarea>
                </div>
                
                <button type="submit" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-3 rounded-lg transition shadow mt-4">Enviar Solicitação</button>
            </form>
        </div>
    </main>

    <footer class="bg-slate-800 text-slate-400 py-6 text-center text-sm">
        <p>&copy; 2026 Guimara Construção. Todos os direitos reservados.</p>
    </footer>

    <script>
        document.getElementById('formAgendamento').addEventListener('submit', async (e) => {
            e.preventDefault();
            const dados = {
                nome: document.getElementById('nome').value,
                telefone: document.getElementById('telefone').value,
                data: document.getElementById('data').value,
                endereco: document.getElementById('endereco').value,
                servico: document.getElementById('servico').value,
                descricao: document.getElementById('descricao').value
            };

            try {
                const response = await fetch('/api/agendamentos', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dados)
                });
                const resData = await response.json();
                if (response.ok) {
                    alert('Solicitação enviada! Guarde seu telefone para consultar o status.');
                    window.location.href = '/status.html';
                } else {
                    alert('Erro: ' + resData.error);
                }
            } catch (err) {
                alert('Erro de conexão com o servidor.');
            }
        });
    </script>
</body>
</html>
