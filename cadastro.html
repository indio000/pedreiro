<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Cliente - Guimara Construção</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="container">
            <div class="logo"><h1>Guimara <span>Construção</span></h1></div>
            <nav>
                <ul>
                    <li><a href="index.html">Início</a></li>
                    <li><a href="servicos.html">Serviços</a></li>
                    <li><a href="clientes.html">Clientes</a></li>
                    <li><a href="index.html#agendar">Agendar Obra</a></li>
                    <li><a href="cadastro.html">Cadastro</a></li>
                    <li><a href="contato.html">Contato</a></li>
                </ul>
            </nav>
            <a href="https://wa.me/5546999011578" target="_blank" class="btn btn-primary">
                <i class="fab fa-whatsapp"></i> WhatsApp
            </a>
        </div>
    </header>

    <section class="hero" style="min-height: 60vh;">
        <div class="hero-content">
            <h1>Cadastro de Cliente</h1>
        </div>
    </section>

    <section style="padding: 100px 0; background: var(--light);">
        <div class="container">
            <div class="agendar-form" style="background: white; box-shadow: var(--shadow);">
                <form id="cadastroForm">
                    <div class="form-group">
                        <label>Nome Completo *</label>
                        <input type="text" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Telefone *</label>
                            <input type="tel" value="(46) 99901-1578" required>
                        </div>
                        <div class="form-group">
                            <label>Data Desejada</label>
                            <input type="date">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Endereço Completo *</label>
                        <input type="text" required>
                    </div>
                    <div class="form-group">
                        <label>Tipo de Serviço *</label>
                        <select required>
                            <option value="">Selecione...</option>
                            <option>Reformas Residenciais</option>
                            <option>Alvenaria e Construção</option>
                            <option>Pisos e Revestimentos</option>
                            <option>Lajes e Coberturas</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Descrição do Projeto *</label>
                        <textarea rows="5" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width:100%; padding:16px;">Cadastrar e Solicitar Orçamento</button>
                </form>
            </div>
        </div>
    </section>

    <footer>
        <div class="container">
            <p>&copy; 2026 Guimara Construção - Capanema, PR</p>
        </div>
    </footer>

    <script>
        document.getElementById('cadastroForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('✅ Cadastro realizado com sucesso!\nEntraremos em contato em breve.');
            this.reset();
        });
    </script>
</body>
</html>
