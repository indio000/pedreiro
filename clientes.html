<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Depoimentos de Clientes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen">

    <nav class="bg-amber-600 text-white shadow-md">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <a href="/" class="text-2xl font-bold flex items-center gap-2"><i class="fa-solid fa-helmet-safety"></i> Guimara</a>
            <div class="hidden md:flex gap-6 font-medium">
                <a href="/" class="hover:text-amber-200 transition">Início</a>
                <a href="/servicos.html" class="hover:text-amber-200 transition">Serviços</a>
                <a href="/agendamentos.html" class="hover:text-amber-200 transition">Agendar</a>
                <a href="/status.html" class="hover:text-amber-200 transition">Status</a>
                <a href="/clientes.html" class="text-amber-200 font-bold">Depoimentos</a>
                <a href="/contato.html" class="hover:text-amber-200 transition">Contato</a>
            </div>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-4 py-12 flex-grow w-full">
        <div class="grid md:grid-cols-3 gap-8">
            <div class="md:col-span-1 bg-white p-6 rounded-2xl shadow-sm border border-gray-100 h-fit">
                <h3 class="text-lg font-bold text-slate-900 mb-4">Deixe seu Relato</h3>
                <form id="formFeedback" class="space-y-3">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Seu Nome</label>
                        <input type="text" id="fbNome" required class="w-full px-3 py-1.5 border rounded-lg text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Cidade</label>
                        <input type="text" id="fbCidade" placeholder="Capanema - PR" class="w-full px-3 py-1.5 border rounded-lg text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Avaliação</label>
                        <div id="starRating" class="flex gap-1 text-amber-400 text-xl cursor-pointer py-1">
                            <i class="fa-solid fa-star star-btn" data-value="1"></i>
                            <i class="fa-solid fa-star star-btn" data-value="2"></i>
                            <i class="fa-solid fa-star star-btn" data-value="3"></i>
                            <i class="fa-solid fa-star star-btn" data-value="4"></i>
                            <i class="fa-solid fa-star star-btn" data-value="5"></i>
                        </div>
                        <input type="hidden" id="fbEstrelas" value="5">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Mensagem</label>
                        <textarea id="fbMensagem" rows="3" required class="w-full px-3 py-1.5 border rounded-lg text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none"></textarea>
                    </div>
                    <button type="submit" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-2 rounded-lg text-sm transition">Publicar</button>
                </form>
            </div>

            <div class="md:col-span-2 space-y-4">
                <h2 class="text-2xl font-bold text-slate-900 mb-2">O que dizem nossos clientes</h2>
                <div id="listaFeedbacks" class="space-y-4"></div>
            </div>
        </div>
    </main>

    <footer class="bg-slate-800 text-slate-400 py-6 text-center text-sm">
        <p>&copy; 2026 Guimara Construção. Todos os direitos reservados.</p>
    </footer>

    <script>
        let ratingSelecionado = 5;

        // Seleção interativa de estrelas no formulário
        const stars = document.querySelectorAll('.star-btn');
        stars.forEach(star => {
            star.addEventListener('click', () => {
                ratingSelecionado = parseInt(star.getAttribute('data-value'));
                document.getElementById('fbEstrelas').value = ratingSelecionado;
                atualizarEstrelasForm();
            });
        });

        function atualizarEstrelasForm() {
            stars.forEach(star => {
                const val = parseInt(star.getAttribute('data-value'));
                if (val <= ratingSelecionado) {
                    star.classList.remove('fa-regular', 'text-gray-300');
                    star.classList.add('fa-solid', 'text-amber-400');
                } else {
                    star.classList.remove('fa-solid', 'text-amber-400');
                    star.classList.add('fa-regular', 'text-gray-300');
                }
            });
        }

        // Função para gerar as estrelas HTML do depoimento
        function gerarEstrelasHTML(qtd) {
            let html = '';
            const total = parseInt(qtd) || 5;
            for (let i = 1; i <= 5; i++) {
                if (i <= total) {
                    html += `<i class="fa-solid fa-star"></i>`;
                } else {
                    html += `<i class="fa-regular fa-star text-gray-300"></i>`;
                }
            }
            return html;
        }

        async function carregarFeedbacks() {
            try {
                const res = await fetch('/api/feedbacks');
                const feedbacks = await res.json();
                const container = document.getElementById('listaFeedbacks');
                container.innerHTML = '';

                feedbacks.forEach(fb => {
                    container.innerHTML += `
                        <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 relative">
                            <div class="text-amber-400 text-sm mb-2">${gerarEstrelasHTML(fb.estrelas)}</div>
                            <p class="text-gray-700 italic text-sm mb-3">"${fb.mensagem}"</p>
                            <div class="flex justify-between items-center text-xs text-gray-500 font-medium">
                                <span><strong>${fb.nome}</strong>, ${fb.cidade}</span>
                                <span>${fb.data}</span>
                            </div>
                        </div>
                    `;
                });
            } catch (err) { console.error(err); }
        }

        document.getElementById('formFeedback').addEventListener('submit', async (e) => {
            e.preventDefault();
            const dados = {
                nome: document.getElementById('fbNome').value,
                cidade: document.getElementById('fbCidade').value,
                estrelas: parseInt(document.getElementById('fbEstrelas').value),
                mensagem: document.getElementById('fbMensagem').value
            };

            await fetch('/api/feedbacks', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dados)
            });

            document.getElementById('formFeedback').reset();
            ratingSelecionado = 5;
            atualizarEstrelasForm();
            carregarFeedbacks();
        });

        carregarFeedbacks();
    </script>
</body>
</html>
